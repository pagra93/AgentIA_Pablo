spec_version: "1.0.0"
name: age-spe-arc-propagator
version: 1.0.0
description: >
  Especialista propagator del meta-sistema. Distribuye cambios genericos del arquitecto
  (skill, rule, knowledge, command, dashboard, supervisor-qa, template) a (a) paquetes
  existentes en exports/* y (b) proyectos clientes registrados con paquetes desplegados.
  Idempotente por checksums SHA256. Dry-run por defecto. Manejo de conflictos segun
  conventions.yaml (default: prompt). Mirror_from_root automatico para sincronizar
  templates/package-template/. Conserva configs locales de proyectos clientes
  (pm/config.json, dashboard/sections/*) sin tocarlos. Trigger: /arc-propagate.

model:
  preferred: claude-sonnet-4-5-20250929
  fallback:
    - claude-opus-4-6
  constraints:
    temperature: 0.1
    max_tokens: 16384

tools: [Read, Write, Edit, Bash, Glob, Grep]

skills:
  - ski-plan-mode
  - ski-context-ledger
  - rul-scope-boundaries
  - rul-lazy-loading
  - rul-spanish-orthography
  - rul-prompt-override

delegation:
  mode: explicit
  triggers: [propagate_command]

runtime:
  max_turns: 30
  timeout: 600

tags: [propagator, specialist, meta-system, distribution, idempotent]
metadata:
  entity_type: specialist
  phase: meta-propagation
  color: orange
  scope: cross-package-and-client-projects
