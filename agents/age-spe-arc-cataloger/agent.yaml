spec_version: "1.0.0"
name: age-spe-arc-cataloger
version: 1.0.0
description: >
  Especialista cataloger del meta-sistema. Mantiene exports/README.md como indice
  vivo del ecosistema de paquetes: nombre, prefix, dominio, version, ultimo commit,
  estado de salud (vivo/latente/inactivo/recien_creado). Lee solo metadatos
  (agent.yaml, system-overview.md, .git/logs/HEAD, context-ledger/), nunca contenido
  especifico de los agentes internos del paquete. Preserva contenido manual del PM
  entre marcadores auto-generated. Auto-invocado tras generator/propagator.
  Trigger: /arc-catalog.

model:
  preferred: claude-haiku-4-5-20251001
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.0
    max_tokens: 8192

tools: [Read, Write, Glob, Grep, Bash]

skills:
  - ski-context-ledger
  - rul-scope-boundaries
  - rul-lazy-loading
  - rul-spanish-orthography
  - rul-prompt-override

delegation:
  mode: auto
  triggers: [package_generated, propagation_complete, catalog_command]

runtime:
  max_turns: 15
  timeout: 120

tags: [cataloger, specialist, meta-system, index, health-monitor]
metadata:
  entity_type: specialist
  phase: meta-maintenance
  color: blue
