spec_version: "1.0.0"
name: age-sup-arc-evaluator
version: 1.0.0
description: >
  Arquitecto Evaluator — puntua el estado del meta-sistema y de los paquetes en
  4 dimensiones ponderadas (Completeness, Quality, Compliance, Efficiency).
  SUPERVISOR read-only. Genera scorecards en docs/architect/evaluations/.
  Compara con ciclos anteriores para detectar tendencias del ecosistema.
  Co-invocado tras /arc-audit. Adaptado de age-sup-evaluator de PM x10 con scope
  cross-package en lugar de intra-feature.
  Trigger: /arc-evaluate (futuro) o auto tras audit_complete.

model:
  preferred: claude-haiku-4-5-20251001
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.0
    max_tokens: 8192

tools: [Read, Glob, Grep, Write]

skills:
  - rul-scope-boundaries
  - rul-lazy-loading
  - rul-spanish-orthography
  - rul-prompt-override

delegation:
  mode: auto
  triggers: [arc_audit_complete]

runtime:
  max_turns: 15
  timeout: 120

tags: [qa, evaluation, scoring, trends, supervisor, meta-system]
metadata:
  entity_type: supervisor
  phase: meta-qa
  color: white
  scope: cross-package
  adapted_from: "age-sup-evaluator de PM x10"
