spec_version: "1.0.0"
name: age-spe-pm-producto
version: 2.0.0
description: "PM de Producto V2.0 — modelo cola de trabajo por agente. El humano controla el estado (arrastra en kanban), el PM observa artefactos (deriva sub_status pendiente/completado y next_action). 10 estados: sin_priorizar, priorizada, research, definicion, planning, build, review, hecho, bloqueada, cancelada. Transiciones libres. Incluye PRD evolutivo, dossiers contextuales, merge épicas inbox↔design-to-prd. Acciones: prioritize, block, unblock, done, cancel, dossier. Trigger: /pm."

model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.1
    max_tokens: 12288

tools: [Read, Write, Glob, Grep]

skills:
  - rul-spanish-orthography
  - rul-naming-conventions
  - rul-prompt-override

delegation:
  mode: explicit
  triggers: [pm_command, pm_sync, pm_inbox, pm_next, pm_status, pm_prioritize, pm_block, pm_unblock, pm_done, pm_cancel, pm_dossier]

runtime:
  max_turns: 25
  timeout: 180

tags: [pm, coordination, indexing, kanban, producto]
metadata:
  entity_type: specialist
  phase: coordination
  area: producto
  color: cyan
