spec_version: "1.0.0"
name: agent-architect
version: 0.1.0
description: >
  Meta-sistema que mantiene paquetes desplegables de agentes (PM x10, Newsletter,
  Marketing, ...). Orquesta 9 agentes (4 especialistas + 5 supervisores) para construir
  paquetes nuevos via mini-discovery, propagar mejoras genericas a todos los paquetes
  y proyectos clientes desplegados, auditar drift contra la convencion canonica, y
  analizar patrones cross-paquete. Hereda filosofia, convenciones y formato de PM x10.
  Sin triple-platform: solo Claude Code. Sin layers como plugins: lo que es util se
  incorpora directamente como agente/skill.
author: pablo
license: MIT

model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 16384

# --- Agents (9 total: 4 specialists + 5 supervisors) ---
# Especialistas: generator, propagator, cataloger, aggregator
# Supervisores: auditor, evaluator, optimizer, cynic, boundary-walker (todos READ-ONLY)
# Fase 8 (criticos): generator, cataloger, auditor — IMPLEMENTADOS
# Fase 9 (resto): propagator, aggregator, evaluator, optimizer, cynic, boundary-walker — pendiente
agents:
  # --- 4 ESPECIALISTAS (age-spe-arc-*) ---
  age-spe-arc-generator:
    path: agents/age-spe-arc-generator/
    description: "Crea paquetes desplegables via mini-discovery de 5 preguntas + stubs honestos. Trigger: /arc-new-package"
    delegation:
      mode: explicit
      triggers: [new_package_command]
  age-spe-arc-propagator:
    path: agents/age-spe-arc-propagator/
    description: "Distribuye cambios genericos (skill, rule, knowledge, command, dashboard, supervisor-qa, template) a paquetes y proyectos clientes. Idempotente, dry-run por defecto. Trigger: /arc-propagate"
    delegation:
      mode: explicit
      triggers: [propagate_command]
  age-spe-arc-cataloger:
    path: agents/age-spe-arc-cataloger/
    description: "Mantiene exports/README.md como indice vivo. Auto-invocado tras generator/propagator. Trigger: /arc-catalog"
    delegation:
      mode: auto
      triggers: [package_generated, propagation_complete, catalog_command]
  age-spe-arc-aggregator:
    path: agents/age-spe-arc-aggregator/
    description: "Analisis macro cross-paquete (6 focos: patrones, comparativa, gaps, cobertura, dependencias, salud-global). Read-only. Inspirado en cross-project-aggregator de luisdomarco. Trigger: /arc-aggregate"
    delegation:
      mode: explicit
      triggers: [aggregate_command]

  # --- 5 SUPERVISORES (age-sup-arc-*) READ-ONLY ---
  age-sup-arc-auditor:
    path: agents/age-sup-arc-auditor/
    description: "Verifica conformidad estructural de paquetes contra conventions.yaml. Read-only. Trigger: /arc-audit"
    delegation:
      mode: explicit
      triggers: [audit_command, after_propagate]
  age-sup-arc-evaluator:
    path: agents/age-sup-arc-evaluator/
    description: "Puntua el estado del meta-sistema y paquetes en 4D ponderadas. Co-invocado tras audit. Adaptado de age-sup-evaluator de PM x10."
    delegation:
      mode: auto
      triggers: [arc_audit_complete]
  age-sup-arc-optimizer:
    path: agents/age-sup-arc-optimizer/
    description: "Lee historial de audits/scorecards/propagaciones, detecta patrones recurrentes, propone mejoras priorizadas. Co-invocado tras evaluator. Adaptado de age-sup-optimizer de PM x10."
    delegation:
      mode: auto
      triggers: [arc_evaluation_complete]
  age-sup-arc-cynic:
    path: agents/age-sup-arc-cynic/
    description: "Adversarial — desafia premisas (Socratic, Devil's Advocate, Five Whys). Read-only. Co-invocado con boundary-walker. Inspirado en adversarial-review de luisdomarco. Trigger: /arc-adversarial"
    delegation:
      mode: explicit
      triggers: [arc_adversarial_command]
  age-sup-arc-boundary-walker:
    path: agents/age-sup-arc-boundary-walker/
    description: "Adversarial — explora bordes y casos extremos (Pre-Mortem, Inversion, Reverse Assumption). Read-only. Co-invocado con cynic. Trigger: /arc-adversarial"
    delegation:
      mode: explicit
      triggers: [arc_adversarial_command]

# --- Skills (6 total: 4 heredados de PM x10 + 2 nuevos inspirados en luisdomarco) ---
skills:
  - ski-plan-mode           # planning estructurado para tareas no triviales
  - ski-doc-updater         # mantenimiento de docs/PROJECT_KNOWLEDGE.md
  - ski-project-docs        # generacion de docs/project-docs/ exportable
  - ski-unknown-unknowns    # detector de riesgos en 8 dimensiones
  - ski-context-ledger      # log append-only por sesion (NUEVO)
  - ski-compression         # distillates de docs largos (NUEVO)

# --- Rules (7 total: 5 heredados de PM x10 + 2 nuevos inspirados en luisdomarco) ---
rules:
  - rul-naming-conventions       # convenciones de nomenclatura
  - rul-git-branch-management    # flujo Git/GitHub
  - rul-spanish-orthography      # ortografia espanola obligatoria
  - rul-llm-coding-discipline    # 4 principios anti-antipatterns LLM
  - rul-prompt-override          # respeto de prompt_override en HU/Epic
  - rul-scope-boundaries         # aislamiento estricto arquitecto/paquetes (NUEVO)
  - rul-lazy-loading             # cargar solo lo necesario (NUEVO)

# --- Knowledge (4 total: 2 heredados de PM x10 + 2 nuevos inspirados en luisdomarco) ---
knowledge:
  - kno-mom-test             # metodologia Mom Test (Rob Fitzpatrick)
  - kno-strategic-thinking   # frameworks de pensamiento estrategico
  - kno-elicitation-methods  # tecnicas de cuestionamiento (NUEVO)
  - kno-mcp-integration      # como anadir/usar servidores MCP (NUEVO)

# --- Workflows (6 comandos /arc-*) ---
workflows:
  - arc-new-package    # /arc-new-package — crear paquete via mini-discovery (generator)
  - arc-propagate      # /arc-propagate — propagar cambios genericos (propagator)
  - arc-audit          # /arc-audit — auditar conformidad de paquetes (auditor)
  - arc-catalog        # /arc-catalog — refrescar exports/README.md (cataloger)
  - arc-aggregate      # /arc-aggregate — analisis macro cross-paquete (aggregator)
  - arc-adversarial    # /arc-adversarial — revision adversarial (cynic + boundary-walker)

# --- Runtime ---
runtime:
  max_turns: 100
  timeout: 600

# --- QA Layer ---
qa:
  tier: full
  scoring:
    completeness: 0.30
    quality: 0.30
    compliance: 0.25
    efficiency: 0.15
  auto_activate: false  # El auditor del arquitecto se invoca explicitamente
  report_path: docs/architect/audits/

# --- Tags & Metadata ---
tags:
  - meta-system
  - architecture
  - package-management
  - propagation
  - agent-os

metadata:
  entity_type: meta-orchestrator
  domain: meta-system
  philosophy: "Single Source of Truth, Propagation Over Duplication"
  parent_system: pm-agent-system  # Hereda convenciones y filosofia
