spec_version: "1.0.0"
name: agent-architect
version: 0.1.0
description: >
  Meta-sistema que mantiene paquetes desplegables de agentes (PM x10, Newsletter,
  Marketing, ...). Orquesta 9 agentes (4 especialistas + 5 supervisores) para construir
  paquetes nuevos via mini-discovery, propagar mejoras genericas a todos los paquetes
  y proyectos clientes desplegados, auditar drift contra la convencion canonica, y
  analizar patrones cross-paquete. Hereda filosofia, convenciones y formato de PM x10.
  Sin triple-platform: solo Claude Code. Sin layers como plugins: lo que es util se
  incorpora directamente como agente/skill.
author: pablo
license: MIT

model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 16384

# --- Agents (9 total: 4 specialists + 5 supervisors) ---
# Especialistas: generator, propagator, cataloger, aggregator
# Supervisores: auditor, evaluator, optimizer, cynic, boundary-walker (todos READ-ONLY)
# Vacio en Fase 1; se rellena progresivamente en Fases 8 y 9.
agents: {}

# --- Skills (6 total: 4 heredados de PM x10 + 2 nuevos inspirados en luisdomarco) ---
skills:
  - ski-plan-mode           # planning estructurado para tareas no triviales
  - ski-doc-updater         # mantenimiento de docs/PROJECT_KNOWLEDGE.md
  - ski-project-docs        # generacion de docs/project-docs/ exportable
  - ski-unknown-unknowns    # detector de riesgos en 8 dimensiones
  - ski-context-ledger      # log append-only por sesion (NUEVO)
  - ski-compression         # distillates de docs largos (NUEVO)

# --- Rules (7 total: 5 heredados de PM x10 + 2 nuevos inspirados en luisdomarco) ---
rules:
  - rul-naming-conventions       # convenciones de nomenclatura
  - rul-git-branch-management    # flujo Git/GitHub
  - rul-spanish-orthography      # ortografia espanola obligatoria
  - rul-llm-coding-discipline    # 4 principios anti-antipatterns LLM
  - rul-prompt-override          # respeto de prompt_override en HU/Epic
  - rul-scope-boundaries         # aislamiento estricto arquitecto/paquetes (NUEVO)
  - rul-lazy-loading             # cargar solo lo necesario (NUEVO)

# --- Knowledge (4 total: 2 heredados de PM x10 + 2 nuevos inspirados en luisdomarco) ---
knowledge:
  - kno-mom-test             # metodologia Mom Test (Rob Fitzpatrick)
  - kno-strategic-thinking   # frameworks de pensamiento estrategico
  - kno-elicitation-methods  # tecnicas de cuestionamiento (NUEVO)
  - kno-mcp-integration      # como anadir/usar servidores MCP (NUEVO)

# --- Workflows (6 comandos /arc-*) ---
workflows:
  - arc-new-package    # /arc-new-package — crear paquete via mini-discovery (generator)
  - arc-propagate      # /arc-propagate — propagar cambios genericos (propagator)
  - arc-audit          # /arc-audit — auditar conformidad de paquetes (auditor)
  - arc-catalog        # /arc-catalog — refrescar exports/README.md (cataloger)
  - arc-aggregate      # /arc-aggregate — analisis macro cross-paquete (aggregator)
  - arc-adversarial    # /arc-adversarial — revision adversarial (cynic + boundary-walker)

# --- Runtime ---
runtime:
  max_turns: 100
  timeout: 600

# --- QA Layer ---
qa:
  tier: full
  scoring:
    completeness: 0.30
    quality: 0.30
    compliance: 0.25
    efficiency: 0.15
  auto_activate: false  # El auditor del arquitecto se invoca explicitamente
  report_path: docs/architect/audits/

# --- Tags & Metadata ---
tags:
  - meta-system
  - architecture
  - package-management
  - propagation
  - agent-os

metadata:
  entity_type: meta-orchestrator
  domain: meta-system
  philosophy: "Single Source of Truth, Propagation Over Duplication"
  parent_system: pm-agent-system  # Hereda convenciones y filosofia
